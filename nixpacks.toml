[providers]
providers = ["python"]

[build]
cmds = [
    # Prefer uv: 10-100x faster, streams progress, parallel downloads.
    # UV_HTTP_TIMEOUT=600 prevents slow-PyPI socket aborts (uv's equivalent
    # of pip's --default-timeout).
    # Fall back to hardened pip (--default-timeout=1000 stops the 15s socket
    # timeouts that silently stall the build and trip Coolify's timeout).
    "UV_HTTP_TIMEOUT=600 uv pip install --system --no-cache . || pip install --no-cache-dir --default-timeout=1000 ."
]

[start]
cmd = "python -m app"